name: CI

# Type check, production build, then a smoke test and an end-to-end test of the
# built site against the Firebase emulators (Firestore and Cloud Storage), so no
# real Firebase project or credentials are involved.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # The Firestore emulator is a Java program.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build, serve and test against the Firebase emulators
        run: npx firebase emulators:exec --only firestore,storage,auth --project demo-fquad "bash scripts/ci-run.sh"

      - name: Server log (on failure)
        if: failure()
        run: cat server.log || true
