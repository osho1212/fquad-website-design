name: CI

# Type check, production build and a smoke test of the built site, on every
# pull request and every push to main. Uses a throwaway database.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: "file:./ci.db"
      SESSION_SECRET: "ci-only-secret-0123456789-abcdefghijklmnopqrstuvwxyz"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Create the throwaway database
        run: npx prisma db push --skip-generate

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Smoke test the built site
        run: |
          npx next start -p 3002 > server.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://localhost:3002/api/health > /dev/null && break
            sleep 2
          done
          bash scripts/smoke-test.sh http://localhost:3002

      - name: Server log (on failure)
        if: failure()
        run: cat server.log || true
