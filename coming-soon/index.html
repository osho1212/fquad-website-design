:root{
  --bg:#fff;
  --fg:#111;
  --muted:#6b6b6b;          /* 5.3:1 on white */
  --hair:rgba(17,17,17,.12);
}

*,*::before,*::after{box-sizing:border-box;border-radius:0}
html,body{margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

body{
  min-height:100svh;
  background:var(--bg);
  color:var(--fg);
  font-family:'Montserrat',system-ui,sans-serif;
  overflow-x:hidden;
  display:flex;flex-direction:column;
  padding:clamp(20px,3.4vw,40px);
}

/* ── Ambient blueprint video ──────────────────────────────────────────
   Same asset the main site uses. It's dark line-art, so it gets the
   main site's light-theme treatment: inverted + desaturated so the lines
   read dark-on-white, with white overlays that lighten rather than
   darken the page. */
.bgv{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.bgv video{
  width:100%;height:100%;object-fit:cover;display:block;
  filter:invert(1) grayscale(1);
  opacity:.22;
}
.bgv .ov{position:absolute;inset:0;background:rgba(255,255,255,.42)}
.bgv .fade{
  position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(255,255,255,.75),transparent,rgba(255,255,255,.75))
}

/* Whisper-faint drafting grid — bottom-most layer, under the video */
.grid{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(to right,rgba(17,17,17,.09) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(17,17,17,.09) 1px,transparent 1px);
  background-size:clamp(56px,7vw,104px) clamp(56px,7vw,104px);
  -webkit-mask-image:radial-gradient(ellipse 82% 70% at 50% 50%,#000 25%,transparent 100%);
  mask-image:radial-gradient(ellipse 82% 70% at 50% 50%,#000 25%,transparent 100%);
}

.shell{position:relative;z-index:2;flex:1;display:flex;flex-direction:column}

/* ── Brand Lockup (Matches Official Studio Identity) ───────────────── */
.brand{display:inline-flex;align-items:center;gap:clamp(14px,1.8vw,20px);text-decoration:none;color:inherit;align-self:center;margin:0 auto}
.brand-box{width:clamp(52px,6.2vw,68px);height:clamp(52px,6.2vw,68px);background:#262626;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:6px}
.brand-box svg{width:100%;height:100%;display:block}
.brand-text{display:flex;flex-direction:column;align-items:center;text-align:center}
.brand-name{font-family:'Good Times',system-ui,sans-serif;font-size:clamp(20px,2.6vw,30px);line-height:1.05;letter-spacing:.06em;font-weight:400;color:var(--fg)}
.brand-tagline{font-family:'Montserrat',system-ui,sans-serif;font-size:clamp(8px,1vw,10.5px);font-weight:400;letter-spacing:.04em;color:var(--fg);margin-top:3px;line-height:1.2;white-space:nowrap}
.brand-by{font-family:'Montserrat',system-ui,sans-serif;font-size:clamp(7.5px,0.9vw,9.5px);font-weight:600;color:var(--fg);margin-top:5px;line-height:1.1}
.brand-founders{font-family:'Montserrat',system-ui,sans-serif;font-size:clamp(8.5px,1.05vw,11.5px);font-weight:700;letter-spacing:.12em;color:var(--fg);margin-top:2px;line-height:1.2;white-space:nowrap}

/* ── The statement ────────────────────────────────────────────────── */
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:clamp(10px,2vh,28px) 0}

/* Padding gives the mesh room to displace without clipping at the edges. */
.mesh{position:relative;width:100%;padding:clamp(18px,5vh,54px) clamp(12px,3vw,40px)}
.mesh canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;opacity:0;transition:opacity .35s ease}
.mesh.is-live canvas{opacity:1}
/* Real text stays in the DOM for a11y + as the no-WebGL fallback; it only
   goes transparent once the mesh is actually drawing. */
.mesh.is-live h1{color:transparent}

h1{
  font-family:'Good Times',system-ui,sans-serif;font-weight:400;
  font-size:clamp(52px,15.5vw,230px);
  line-height:.9;letter-spacing:.01em;
  margin:0;text-transform:uppercase;
}
h1 span{display:block}

.meta{
  margin:clamp(20px,3.4vh,34px) 0 0;
  font-size:clamp(9px,1.35vw,11px);letter-spacing:.3em;text-transform:uppercase;
  color:var(--muted);line-height:1.9
}

/* ── Countdown ────────────────────────────────────────────────────── */
.count{
  display:flex;justify-content:center;align-items:flex-start;flex-wrap:nowrap;
  margin:clamp(26px,4.6vh,46px) 0 0
}
.unit{position:relative;padding:0 clamp(13px,3vw,36px);text-align:center}
/* hairline rule between units, echoing the drafting grid */
.unit+.unit::before{
  content:'';position:absolute;left:0;top:9%;bottom:22%;width:1px;background:var(--hair)
}
.num{
  display:block;font-family:'Good Times',system-ui,sans-serif;font-weight:400;
  font-size:clamp(24px,4.2vw,56px);line-height:1;letter-spacing:.02em;
  font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1
}
.lbl{
  display:block;margin-top:clamp(8px,1.3vh,13px);
  font-size:clamp(8px,1.05vw,10px);letter-spacing:.26em;text-transform:uppercase;color:var(--muted)
}
.count.is-done .num{font-size:clamp(20px,3.4vw,44px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:520px){
  .unit{padding:0 clamp(9px,3.4vw,18px)}
  .lbl{letter-spacing:.16em}
}

/* ── Foot ─────────────────────────────────────────────────────────── */
footer{
  display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;
  border-top:1px solid var(--hair);padding-top:15px;
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)
}
footer a{color:var(--fg);text-decoration:none;border-bottom:1px solid var(--hair);padding-bottom:2px;transition:border-color .25s ease}
footer a:hover{border-color:var(--fg)}
a:focus-visible{outline:2px solid var(--fg);outline-offset:3px}

@media (prefers-reduced-motion:reduce){
  .bgv video{display:none}
}

@media (max-width:640px){
  footer{justify-content:center;text-align:center;gap:10px}
  .meta{letter-spacing:.22em}
}
</style>
</head>

  var sr = document.getElementById('cdSr');
  if (!box || isNaN(target)) return;

  var cells = {};
  [].forEach.call(box.querySelectorAll('[data-cd]'), function (el) {
    cells[el.getAttribute('data-cd')] = el;
  });

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function render() {
    var left = target - Date.now();

    if (left <= 0) {                       // past the date — never show negatives
      box.classList.add('is-done');
      cells.d.textContent = '00'; cells.h.textContent = '00';
      cells.m.textContent = '00'; cells.s.textContent = '00';
      sr.textContent = 'Launch date reached.';
      clearInterval(timer);
      return;
    }

    var sec = Math.floor(left / 1000);
    var d = Math.floor(sec / 86400);
    var h = Math.floor((sec % 86400) / 3600);
    var m = Math.floor((sec % 3600) / 60);
    var s = sec % 60;

    cells.d.textContent = pad(d);
    cells.h.textContent = pad(h);
    cells.m.textContent = pad(m);
    cells.s.textContent = pad(s);
    // Announced once on load rather than every tick.
    if (!sr.textContent) sr.textContent = d + ' days until launch.';
  }

  render();
  var timer = setInterval(render, 1000);
  // Re-sync after a background tab / sleep, where intervals drift or stall.
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) render();
  });
})();

/* ════════════════════════════════════════════════════════════════════
   Mesh text hover — WebGL2 port of the Originkit component.
   The headline is rasterised to a texture, mapped onto a 96x40 vertex
   grid, and each vertex is dragged by the cursor then sprung back.
   Progressive enhancement: the DOM <h1> renders normally and is only
   hidden once the mesh is confirmed drawing.
   ══════════════════════════════════════════════════════════════════ */
(function () {
  var GRID_W = 96, GRID_H = 40;
  var SPRING_K = 0.08, DAMPING = 0.9, DT = 0.1, CHROMA = 0.005;
  var FORCE = 12 / 10;                    // preset force, /10 as in source
  var SPLIT = ['#b5b5b5', '#6b6b6b'];     // neutral fringes — no colour cast

  var wrap = document.getElementById('mesh');
  var h1 = document.getElementById('meshText');
  var canvas = document.getElementById('meshCanvas');
  if (!wrap || !h1 || !canvas) return;

  // Respect reduced-motion and skip touch/coarse pointers: this is a hover
  // effect, and on those devices the plain headline is the better result.
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var hoverable = matchMedia('(hover: hover) and (pointer: fine)').matches;
  if (reduce || !hoverable) { canvas.remove(); return; }

  var gl = canvas.getContext('webgl2', { alpha: true, premultipliedAlpha: true, antialias: true });
  if (!gl) { canvas.remove(); return; }   // fallback: plain <h1> stays visible

  var VERT = `#version 300 es
in vec2 aPos; in vec2 aUv; in vec2 aDisp;
out vec2 vUv; out float vMag;
void main(){ gl_Position=vec4(aPos+aDisp,0.0,1.0); vUv=aUv; vMag=length(aDisp); }`;

  var FRAG = `#version 300 es
precision highp float;
in vec2 vUv; in float vMag; out vec4 outColor;
uniform sampler2D uTex; uniform float uChroma;
uniform vec3 uColorA; uniform vec3 uColorB;
void main(){
  vec4 base = texture(uTex, vUv);
  if (uChroma > 0.0) {
    float o = uChroma * ${CHROMA.toFixed(5)} * clamp(vMag * 8.0, 0.0, 1.0);
    float aOff = texture(uTex, vUv + vec2(o, 0.0)).a;
    float bOff = texture(uTex, vUv - vec2(o, 0.0)).a;
    vec3 col = base.rgb;
    col += uColorA * max(0.0, aOff - base.a);
    col += uColorB * max(0.0, bOff - base.a);
    float aMax = max(base.a, max(aOff, bOff));
    outColor = vec4(col, aMax);
  } else { outColor = base; }
}`;

  function compile(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error('mesh shader:', gl.getShaderInfoLog(s)); gl.deleteShader(s); return null;
    }
    return s;
  }
  function parseColor(v) {
    var h = String(v).trim().replace('#', '');
    if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join('');
    return [parseInt(h.slice(0,2),16)/255, parseInt(h.slice(2,4),16)/255, parseInt(h.slice(4,6),16)/255];
  }

  var vs = compile(gl.VERTEX_SHADER, VERT), fs = compile(gl.FRAGMENT_SHADER, FRAG);
  if (!vs || !fs) { canvas.remove(); return; }
  var prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    console.error('mesh link:', gl.getProgramInfoLog(prog)); canvas.remove(); return;
  }

  // ── Grid geometry ───────────────────────────────────────────────────
  var vertCount = (GRID_W + 1) * (GRID_H + 1);
  var positions = new Float32Array(vertCount * 2);
  var uvs = new Float32Array(vertCount * 2);
  for (var y = 0; y <= GRID_H; y++) {
    for (var x = 0; x <= GRID_W; x++) {
      var i = y * (GRID_W + 1) + x, u = x / GRID_W, v = y / GRID_H;
      positions[i*2] = u*2-1; positions[i*2+1] = 1-v*2;
      uvs[i*2] = u; uvs[i*2+1] = v;
    }
  }
  var indexCount = GRID_W * GRID_H * 6;
  var indices = new Uint32Array(indexCount), k = 0;
  for (var y2 = 0; y2 < GRID_H; y2++) {
    for (var x2 = 0; x2 < GRID_W; x2++) {
      var a = y2*(GRID_W+1)+x2, b = a+1, c = a+(GRID_W+1), d = c+1;
      indices[k++]=a; indices[k++]=c; indices[k++]=b;
      indices[k++]=b; indices[k++]=c; indices[k++]=d;
    }
  }
  var disp = new Float32Array(vertCount * 2);
  var vel  = new Float32Array(vertCount * 2);

  var aPos = gl.getAttribLocation(prog,'aPos'), aUv = gl.getAttribLocation(prog,'aUv'),
      aDisp = gl.getAttribLocation(prog,'aDisp'),
      uTex = gl.getUniformLocation(prog,'uTex'), uChroma = gl.getUniformLocation(prog,'uChroma'),
      uColorA = gl.getUniformLocation(prog,'uColorA'), uColorB = gl.getUniformLocation(prog,'uColorB');

  var vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  function buf(data, loc, usage) {
    var b = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, data, usage);
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    return b;
  }
  buf(positions, aPos, gl.STATIC_DRAW);
  buf(uvs, aUv, gl.STATIC_DRAW);
  var dispBuf = buf(disp, aDisp, gl.DYNAMIC_DRAW);
  var idxBuf = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxBuf);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indices, gl.STATIC_DRAW);

  var tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

  var cA = parseColor(SPLIT[0]), cB = parseColor(SPLIT[1]);
  var lines = [].map.call(h1.querySelectorAll('span'), function (s) {
    return s.textContent.trim().toUpperCase();
  });
  var ready = false;

  // ── Rasterise the headline, mirroring the <h1>'s own computed type ──
  function rebuildTex() {
    var dpr = window.devicePixelRatio || 1;
    var cs = getComputedStyle(h1);
    var fontSize = parseFloat(cs.fontSize) * dpr;
    var lineH = (parseFloat(cs.lineHeight) || parseFloat(cs.fontSize) * 0.9) * dpr;
    var w = Math.max(2, canvas.width), h = Math.max(2, canvas.height);

    var c2 = document.createElement('canvas');
    c2.width = w; c2.height = h;
    var ctx = c2.getContext('2d');
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = cs.color && cs.color !== 'rgba(0, 0, 0, 0)' ? cs.color : '#111111';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if ('letterSpacing' in ctx) ctx.letterSpacing = (0.01 * fontSize) + 'px';
    ctx.font = 'normal 400 ' + fontSize + 'px "Good Times", system-ui, sans-serif';

    var total = lines.length;
    for (var i = 0; i < total; i++) {
      var yy = h / 2 + (i - (total - 1) / 2) * lineH;
      ctx.fillText(lines[i], w / 2, yy);
    }

    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c2);
  }

  function resize() {
    var dpr = window.devicePixelRatio || 1;
    var r = wrap.getBoundingClientRect();
    var w = Math.max(2, Math.round(r.width * dpr)), h = Math.max(2, Math.round(r.height * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w; canvas.height = h;
      gl.viewport(0, 0, w, h);
    }
    if (ready) rebuildTex();
  }
  new ResizeObserver(resize).observe(wrap);
  resize();

  // Rasterise only once the embedded face is actually loaded, otherwise
  // canvas 2D silently falls back to a system font.
  var fontSpec = '400 64px "Good Times"';
  var fontReady = document.fonts && document.fonts.load
    ? document.fonts.load(fontSpec).then(function () { return document.fonts.ready; })
    : Promise.resolve();

  fontReady.catch(function () {}).then(function () {
    ready = true;
    rebuildTex();
    wrap.classList.add('is-live');   // hide the DOM text only now
  });

  // ── Cursor ──────────────────────────────────────────────────────────
  var cur = { x: 99, y: 99, px: 99, py: 99, vx: 0, vy: 0, inside: false };
  window.addEventListener('pointermove', function (e) {
    var r = canvas.getBoundingClientRect();
    if (!r.width || !r.height) return;
    var nx = ((e.clientX - r.left) / r.width) * 2 - 1;
    var ny = 1 - ((e.clientY - r.top) / r.height) * 2;
    if (!cur.inside) { cur.px = nx; cur.py = ny; cur.inside = true; }
    cur.x = nx; cur.y = ny;
  }, { passive: true });
  document.addEventListener('pointerleave', function () {
    cur.inside = false; cur.x = 99; cur.y = 99; cur.vx = 0; cur.vy = 0;
  });

  // ── Loop ────────────────────────────────────────────────────────────
  function tick() {
    cur.vx = cur.x - cur.px; cur.vy = cur.y - cur.py;
    if (Math.hypot(cur.vx, cur.vy) > 0.3) { cur.vx = 0; cur.vy = 0; }
    cur.px = cur.x; cur.py = cur.y;

    for (var i = 0; i < vertCount; i++) {
      var i2 = i * 2;
      var px = positions[i2], py = positions[i2+1];
      var dx = disp[i2], dy = disp[i2+1];
      var cx = cur.x - (px + dx), cy = cur.y - (py + dy);
      var cd = Math.hypot(cx, cy);
      var prox = Math.max(0, 1 / (1 + cd / 0.05) - 0.1);

      var vx = vel[i2], vy = vel[i2+1];
      vx += cur.vx * FORCE * prox;  vy += cur.vy * FORCE * prox;
      vx -= dx * SPRING_K;          vy -= dy * SPRING_K;
      vx *= DAMPING;                vy *= DAMPING;
      vel[i2] = vx; vel[i2+1] = vy;

      var ndx = dx + vx * DT, ndy = dy + vy * DT;
      disp[i2]   = ndx > 1 ? 1 : ndx < -1 ? -1 : ndx;
      disp[i2+1] = ndy > 1 ? 1 : ndy < -1 ? -1 : ndy;
    }

    gl.bindBuffer(gl.ARRAY_BUFFER, dispBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, disp);

    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(prog);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.uniform1i(uTex, 0);
    gl.uniform1f(uChroma, 1.0);
    gl.uniform3f(uColorA, cA[0], cA[1], cA[2]);
    gl.uniform3f(uColorB, cB[0], cB[1], cB[2]);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.bindVertexArray(vao);
    gl.drawElements(gl.TRIANGLES, indexCount, gl.UNSIGNED_INT, 0);

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
